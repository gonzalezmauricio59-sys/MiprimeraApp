name: Compilar APK Android

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/motivational-alarm-web-app-kkuuua
    paths:
      - 'index.html'
      - 'src/**'
      - 'android/**'
      - 'scripts/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm ci

      - name: Generar www/ y sincronizar Android
        run: |
          npm run build:www
          npx cap sync android

      - name: Compilar APK de debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: alarma-motivacional-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
