<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Alarma Motivacional</title>
<style>
  :root{
    --bg: #0b0d14;
    --bg-card: #151824;
    --bg-card2: #1c1f2e;
    --accent: #ff5f5f;
    --accent2: #ffb84d;
    --text: #f2f2f7;
    --text-dim: #9a9db0;
    --border: #2a2e42;
    --danger: #ff4d4d;
    --success: #4dff9e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    overscroll-behavior-y: contain;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 16px 16px 100px; }

  header.top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 4px 20px;
  }
  header.top h1 {
    font-size: 22px; margin: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    font-weight: 800; letter-spacing: -0.5px;
  }
  header.top .clock {
    font-size: 13px; color: var(--text-dim);
  }

  .tabs {
    display: flex; gap: 8px; margin-bottom: 18px;
    background: var(--bg-card); border-radius: 14px; padding: 4px;
  }
  .tabs button {
    flex: 1; padding: 10px 6px; border: none; border-radius: 10px;
    background: transparent; color: var(--text-dim); font-size: 14px; font-weight: 600;
    cursor: pointer; transition: all .15s ease;
  }
  .tabs button.active {
    background: linear-gradient(135deg, var(--accent), #ff8a5c);
    color: #fff;
  }

  .view { display: none; }
  .view.active { display: block; }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
  }

  .alarm-item {
    display: flex; align-items: center; gap: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .alarm-item.disabled { opacity: 0.45; }
  .alarm-time {
    font-size: 30px; font-weight: 700; letter-spacing: -1px; min-width: 92px;
  }
  .alarm-info { flex: 1; min-width: 0; }
  .alarm-days { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
  .alarm-link { font-size: 12px; color: var(--accent2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .alarm-actions { display: flex; align-items: center; gap: 10px; }

  .switch {
    position: relative; width: 46px; height: 26px; flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #33374a; border-radius: 999px; transition: .2s;
  }
  .slider:before {
    content: ""; position: absolute; height: 20px; width: 20px; left: 3px; top: 3px;
    background: #fff; border-radius: 50%; transition: .2s;
  }
  input:checked + .slider { background: var(--accent); }
  input:checked + .slider:before { transform: translateX(20px); }

  .icon-btn {
    background: none; border: none; color: var(--text-dim);
    font-size: 18px; cursor: pointer; padding: 6px;
  }
  .icon-btn:hover { color: var(--text); }

  .empty-state {
    text-align: center; color: var(--text-dim); padding: 60px 20px;
    font-size: 15px; line-height: 1.6;
  }
  .empty-state .big { font-size: 44px; margin-bottom: 10px; }

  .fab {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%);
    max-width: 480px; width: calc(100% - 32px);
    display: flex; justify-content: center;
    z-index: 20;
  }
  .fab button {
    width: 64px; height: 64px; border-radius: 50%; border: none;
    background: linear-gradient(135deg, var(--accent), #ff8a5c);
    color: #fff; font-size: 30px; font-weight: 300;
    box-shadow: 0 8px 24px rgba(255,95,95,0.4);
    cursor: pointer;
  }

  label { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 6px; font-weight: 600; }
  input[type="time"], input[type="text"], input[type="url"], textarea {
    width: 100%; background: var(--bg-card2); border: 1px solid var(--border);
    color: var(--text); border-radius: 12px; padding: 12px 14px; font-size: 16px;
    outline: none;
  }
  input[type="time"] { font-size: 26px; text-align: center; font-weight: 700; }
  textarea { resize: vertical; min-height: 70px; font-family: inherit; }

  .day-picker { display: flex; gap: 6px; flex-wrap: wrap; }
  .day-chip {
    flex: 1; min-width: 38px; text-align: center; padding: 10px 0;
    border-radius: 10px; background: var(--bg-card2); border: 1px solid var(--border);
    color: var(--text-dim); font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .day-chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  .sound-chip { min-width: 0; font-size: 11.5px; line-height: 1.3; padding: 10px 4px; }

  .theme-chip { min-width: 72px; font-size: 11.5px; line-height: 1.3; padding: 10px 4px; }
  .theme-chip-add { border-style: dashed; color: var(--accent2); }
  .required-hint { font-size: 11px; color: var(--accent2); font-weight: 700; margin-left: 4px; }

  .file-drop {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-card2); border: 1px dashed var(--border);
    border-radius: 12px; padding: 12px 14px; cursor: pointer;
  }
  .file-drop input[type="file"] { display: none; }
  .file-drop .file-drop-label { font-size: 13px; color: var(--text-dim); flex: 1; }
  .file-drop .file-drop-icon { font-size: 20px; }
  .hint { font-size: 11.5px; color: var(--text-dim); margin-top: 6px; line-height: 1.4; }

  .btn-row { display: flex; gap: 10px; margin-top: 22px; }
  .btn {
    flex: 1; padding: 14px; border-radius: 12px; border: none;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .btn-primary { background: linear-gradient(135deg, var(--accent), #ff8a5c); color: #fff; }
  .btn-secondary { background: var(--bg-card2); color: var(--text); border: 1px solid var(--border); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid rgba(255,77,77,0.4); }

  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 50; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.active { display: flex; }
  .modal-sheet {
    background: var(--bg-card); width: 100%; max-width: 480px;
    border-radius: 20px 20px 0 0; padding: 20px 20px 30px;
    max-height: 88vh; overflow-y: auto;
  }
  .modal-sheet h2 { margin: 0 0 4px; font-size: 19px; }
  .modal-close { text-align: right; }
  .modal-close button { background: none; border: none; color: var(--text-dim); font-size: 22px; cursor: pointer; }

  .phrase-item {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 10px; background: var(--bg-card2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; margin-bottom: 10px;
  }
  .phrase-item p { margin: 0; font-size: 14px; line-height: 1.4; flex: 1; }
  .phrase-item .tag { display:inline-block; font-size: 10px; color: var(--accent2); margin-top:6px; font-weight:700; letter-spacing: .5px;}
  .phrase-actions { display: flex; gap: 6px; flex-shrink: 0; }

  /* Ring / alarm firing overlay */
  #ringOverlay {
    display: none; position: fixed; inset: 0; z-index: 999;
    background: radial-gradient(circle at 50% 20%, #2a1030, #0b0d14 70%);
    flex-direction: column; align-items: center; justify-content: center;
    padding: 30px; text-align: center;
  }
  #ringOverlay.active { display: flex; }
  #ringOverlay .time-now {
    font-size: 20px; color: var(--text-dim); margin-bottom: 6px; letter-spacing: 2px;
  }
  #ringOverlay .pulse-icon {
    font-size: 60px; margin-bottom: 18px;
    animation: pulse 1s infinite ease-in-out;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  #ringOverlay .phrase {
    font-size: 30px; font-weight: 800; line-height: 1.3;
    margin-bottom: 34px; max-width: 420px;
  }
  #ringOverlay .video-wrap {
    display: none; width: 100%; max-width: 420px; margin-bottom: 18px;
  }
  #ringOverlay .video-box {
    position: relative; width: 100%; padding-top: 56.25%;
    border-radius: 16px; overflow: hidden; background: #000;
    box-shadow: 0 0 0 1px var(--border);
  }
  #ringOverlay .video-box iframe {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0;
  }
  #ringOverlay .play-btn {
    display: flex; align-items: center; gap: 10px; justify-content: center;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff; border: none; border-radius: 999px;
    padding: 18px 30px; font-size: 17px; font-weight: 800;
    margin-top: 14px; cursor: pointer; width: 100%;
  }
  #ringOverlay .tiktok-btn {
    display: none; align-items: center; gap: 10px; justify-content: center;
    background: linear-gradient(135deg, #ff0050, #00f2ea);
    color: #fff; border: none; border-radius: 999px;
    padding: 18px 30px; font-size: 17px; font-weight: 800;
    margin-bottom: 18px; cursor: pointer; width: 100%; max-width: 340px;
  }
  #ringOverlay .stop-btn {
    background: var(--bg-card2); color: var(--text); border: 1px solid var(--border);
    border-radius: 999px; padding: 16px 40px; font-size: 16px; font-weight: 700; cursor: pointer;
    width: 100%; max-width: 340px;
  }

  ::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <h1>⏰ Motivación</h1>
    <div class="clock" id="liveClock">--:--</div>
  </header>

  <div class="tabs">
    <button class="active" data-view="alarms">Alarmas</button>
    <button data-view="phrases">Frases</button>
  </div>

  <!-- ALARMS VIEW -->
  <div class="view active" id="view-alarms">
    <div id="alarmList"></div>
  </div>

  <!-- PHRASES VIEW -->
  <div class="view" id="view-phrases">
    <div class="card">
      <div style="font-weight:700; margin-bottom:10px;">Categoría</div>
      <div class="day-picker" id="phraseCategoryPicker"></div>
      <div id="phraseSeriesPickerWrap" style="display:none; margin-top:8px;">
        <div class="day-picker" id="phraseSeriesPicker"></div>
      </div>
    </div>
    <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div style="font-weight:700;">Frases</div>
        <div style="font-size:12px; color:var(--text-dim);" id="phraseCount"></div>
      </div>
      <button class="btn btn-primary" style="flex:none; padding:10px 16px;" onclick="openPhraseModal()">+ Agregar</button>
    </div>
    <div id="phraseList"></div>
  </div>

  <div class="fab">
    <button onclick="openAlarmModal()">+</button>
  </div>
</div>

<!-- Alarm creation/edit modal -->
<div class="modal-overlay" id="alarmModal">
  <div class="modal-sheet">
    <div class="modal-close"><button onclick="closeAlarmModal()">✕</button></div>
    <h2 id="alarmModalTitle">Nueva alarma</h2>
    <input type="hidden" id="alarmId">

    <label>Hora</label>
    <input type="time" id="alarmTime" value="07:00">

    <label>Repetir</label>
    <div class="day-picker" id="dayPicker">
      <div class="day-chip" data-day="1">L</div>
      <div class="day-chip" data-day="2">M</div>
      <div class="day-chip" data-day="3">X</div>
      <div class="day-chip" data-day="4">J</div>
      <div class="day-chip" data-day="5">V</div>
      <div class="day-chip" data-day="6">S</div>
      <div class="day-chip" data-day="0">D</div>
    </div>

    <label>Tema de las frases <span class="required-hint">obligatorio</span></label>
    <div class="day-picker" id="categoryPicker"></div>
    <div id="seriesPickerWrap" style="display:none; margin-top:8px;">
      <div class="day-picker" id="seriesPicker"></div>
    </div>

    <label>Nombre (opcional)</label>
    <input type="text" id="alarmLabel" placeholder="Ej: Entrenar como Naruto">

    <label>Sonido de la alarma</label>
    <div class="day-picker">
      <div class="day-chip sound-chip active" data-sound="default">🔔<br>Tono</div>
      <div class="day-chip sound-chip" data-sound="file">🎵<br>Audio propio</div>
      <div class="day-chip sound-chip" data-sound="youtube">▶️<br>YouTube</div>
    </div>

    <div id="soundFileSection" style="display:none;">
      <label class="file-drop" for="alarmAudioFile">
        <span class="file-drop-icon">🎵</span>
        <span class="file-drop-label" id="alarmAudioFileName">Tocá para elegir un MP3 de tu celular</span>
      </label>
      <input type="file" id="alarmAudioFile" accept="audio/*">
      <div class="hint">Máx. 3MB para poder guardarlo en el navegador.</div>
    </div>

    <div id="soundYoutubeSection" style="display:none;">
      <label>Link de YouTube</label>
      <input type="url" id="alarmYoutube" placeholder="https://www.youtube.com/watch?v=...">
      <div class="hint">Se mostrará el video en pantalla completa cuando suene la alarma.</div>
    </div>

    <label>Link de TikTok (opcional)</label>
    <input type="url" id="alarmTiktok" placeholder="https://www.tiktok.com/@usuario/video/...">

    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closeAlarmModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="saveAlarm()">Guardar</button>
    </div>
  </div>
</div>

<!-- Phrase creation/edit modal -->
<div class="modal-overlay" id="phraseModal">
  <div class="modal-sheet">
    <div class="modal-close"><button onclick="closePhraseModal()">✕</button></div>
    <h2 id="phraseModalTitle">Nueva frase</h2>
    <input type="hidden" id="phraseId">

    <label>Categoría <span class="required-hint">obligatorio</span></label>
    <div class="day-picker" id="phraseModalCategoryPicker"></div>
    <div id="phraseModalSeriesWrap" style="display:none; margin-top:8px;">
      <div class="day-picker" id="phraseModalSeriesPicker"></div>
    </div>

    <label>Frase motivacional</label>
    <textarea id="phraseText" placeholder="Escribe tu frase..."></textarea>
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="closePhraseModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="savePhrase()">Guardar</button>
    </div>
  </div>
</div>

<!-- Ring overlay -->
<div id="ringOverlay">
  <div class="time-now" id="ringTime">07:00</div>
  <div class="pulse-icon" id="ringPulseIcon">🔥</div>
  <div class="phrase" id="ringPhrase">¡Levántate y vence!</div>
  <div class="video-wrap" id="ringVideoWrap">
    <div class="video-box"><iframe id="ringVideoFrame" allow="autoplay; encrypted-media" allowfullscreen playsinline></iframe></div>
    <button class="play-btn" id="ringVideoPlayBtn">▶ Reproducir mi motivación</button>
  </div>
  <button class="tiktok-btn" id="ringTiktokBtn">🎵 Ver mi motivación</button>
  <button class="stop-btn" onclick="stopAlarm()">Detener alarma</button>
</div>

<audio id="alarmAudio" loop></audio>

function loadQueues() {
  try { return JSON.parse(localStorage.getItem(STORAGE_QUEUES)) || {}; } catch(e){ return {}; }
}
function saveQueues(q) { localStorage.setItem(STORAGE_QUEUES, JSON.stringify(q)); }

function topicKey(category, series) {
  if (!category) return 'legacy_all';
  return category === 'anime' ? `anime:${series}` : category;
}

function phrasesForTopic(category, series) {
  const phrases = loadPhrases();
  if (!category) return phrases;
  return phrases.filter(p => p.category === category && (category !== 'anime' || p.series === series));
}

/* ---------- Rotación de frases sin repetir, por tema ---------- */
function getNextPhrase(themeCategory, themeSeries) {
  const pool = phrasesForTopic(themeCategory, themeSeries);
  if (pool.length === 0) return { text: '¡Vamos, tú puedes lograrlo hoy!' };
  const key = topicKey(themeCategory, themeSeries);
  const queues = loadQueues();
  let queue = (queues[key] || []).filter(id => pool.some(p => p.id === id));
  if (queue.length === 0) {
    queue = pool.map(p => p.id);
    // shuffle
    for (let i = queue.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [queue[i], queue[j]] = [queue[j], queue[i]];
    }
  }
  const nextId = queue.shift();
  queues[key] = queue;
  saveQueues(queues);
  return pool.find(p => p.id === nextId) || pool[0];
}

const DAY_NAMES = ['D','L','M','X','J','V','S'];
function formatDays(days) {
  if (!days || days.length === 0) return 'Una vez';
  if (days.length === 7) return 'Todos los días';
  const sorted = [1,2,3,4,5,6,0].filter(d => days.includes(d));
  if (JSON.stringify(sorted.slice().sort()) === JSON.stringify([1,2,3,4,5].sort())) return 'Lunes a viernes';
  if (JSON.stringify(sorted.slice().sort()) === JSON.stringify([0,6].sort())) return 'Fines de semana';
  return sorted.map(d => DAY_NAMES[d]).join(' ');
}

function soundLabel(a) {
  if (a.soundType === 'youtube') return '▶️ YouTube';
  if (a.soundType === 'file') return '🎵 Audio propio';
  return '🔔 Tono';
}

function themeLabel(a) {
  if (!a.themeCategory) return 'Sin tema';
  if (a.themeCategory === 'anime') return '🎌 ' + seriesName(a.themeSeries);
  const cat = categoryById(a.themeCategory);
  return (cat ? (cat.icon || '⭐') + ' ' + cat.name : a.themeCategory);
}

function extractYouTubeId(url) {
  if (!url) return null;
  const m = url.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

function renderAlarms() {
  const alarms = loadAlarms().sort((a,b) => a.time.localeCompare(b.time));
  const list = document.getElementById('alarmList');
  if (alarms.length === 0) {
    list.innerHTML = `<div class="empty-state"><div class="big">⏰</div>No tienes alarmas todavía.<br>Toca el botón + para crear tu primera alarma motivacional.</div>`;
    return;
  }
  list.innerHTML = alarms.map(a => `
    <div class="alarm-item ${a.enabled ? '' : 'disabled'}">
      <div class="alarm-time">${a.time}</div>
      <div class="alarm-info">
        <div>${a.label ? escapeHtml(a.label) : 'Alarma'}</div>
        <div class="alarm-days">${formatDays(a.days)} · ${escapeHtml(themeLabel(a))}</div>
        <div class="alarm-days">${soundLabel(a)}</div>
        ${a.tiktok ? `<div class="alarm-link">🎵 ${escapeHtml(a.tiktok)}</div>` : ''}
      </div>
      <div class="alarm-actions">
        <button class="icon-btn" onclick="editAlarm('${a.id}')">✏️</button>
        <button class="icon-btn" onclick="deleteAlarm('${a.id}')">🗑️</button>
        <label class="switch">
          <input type="checkbox" ${a.enabled ? 'checked' : ''} onchange="toggleAlarm('${a.id}', this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  `).join('');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function toggleAlarm(id, enabled) {
  const alarms = loadAlarms();
  const a = alarms.find(x => x.id === id);
  if (a) { a.enabled = enabled; saveAlarms(alarms); }
  renderAlarms();
}

function deleteAlarm(id) {
  if (!confirm('¿Borrar esta alarma?')) return;
  saveAlarms(loadAlarms().filter(a => a.id !== id));
  renderAlarms();
}

  if (!file) return;
  if (file.size > 3 * 1024 * 1024) {
    alert('El archivo es muy pesado. Elegí un MP3 de menos de 3MB para poder guardarlo en el navegador.');
    e.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = () => {
    pendingAudioData = reader.result;
    pendingAudioFileName = file.name;
    document.getElementById('alarmAudioFileName').textContent = '🎵 ' + file.name;
  };
  reader.readAsDataURL(file);
});

function persistAlarms(alarms) {
  try {
    saveAlarms(alarms);
    return true;
  } catch (e) {
    alert('No se pudo guardar: el almacenamiento del navegador está lleno. Probá con un audio más liviano o borrá alarmas viejas.');
    return false;
  }
}

function saveAlarm() {
  const time = document.getElementById('alarmTime').value;
  if (!time) { alert('Selecciona una hora'); return; }
  const label = document.getElementById('alarmLabel').value.trim();
  const tiktok = document.getElementById('alarmTiktok').value.trim();
  const alarms = loadAlarms();
  const existing = editingAlarmId ? alarms.find(x => x.id === editingAlarmId) : null;

  let audioData = null, audioFileName = null;
  if (selectedSoundType === 'file') {
    audioData = pendingAudioData || (existing ? existing.audioData : null);
    audioFileName = pendingAudioFileName || (existing ? existing.audioFileName : null);
    if (!audioData) { alert('Subí un archivo de audio o elegí otro tipo de sonido.'); return; }
  }

  let youtubeUrl = null, youtubeId = null;
  if (selectedSoundType === 'youtube') {
    youtubeUrl = document.getElementById('alarmYoutube').value.trim();
    youtubeId = extractYouTubeId(youtubeUrl);
    if (!youtubeId) { alert('Ese link de YouTube no parece válido. Copiá el link completo del video.'); return; }
  }

  if (!selectedThemeCategory) { alert('Elegí un tema para esta alarma.'); return; }
  if (selectedThemeCategory === 'anime' && !selectedThemeSeries) { alert('Elegí una serie de anime para esta alarma.'); return; }

  if (existing) {
    existing.time = time; existing.label = label; existing.tiktok = tiktok;
    existing.days = Array.from(selectedDays);
    existing.soundType = selectedSoundType;
    existing.audioData = audioData; existing.audioFileName = audioFileName;
    existing.youtubeUrl = youtubeUrl; existing.youtubeId = youtubeId;
    existing.themeCategory = selectedThemeCategory;
    existing.themeSeries = selectedThemeCategory === 'anime' ? selectedThemeSeries : null;
  } else {
    alarms.push({
      id: uid(), time, label, tiktok,
      days: Array.from(selectedDays),
      soundType: selectedSoundType,
      audioData, audioFileName, youtubeUrl, youtubeId,
      themeCategory: selectedThemeCategory,
      themeSeries: selectedThemeCategory === 'anime' ? selectedThemeSeries : null,
      enabled: true,
      lastFired: null
    });
  }
  if (!persistAlarms(alarms)) return;
  closeAlarmModal();
  renderAlarms();
}

  if (!text) { alert('Escribe una frase'); return; }
  if (!phraseModalCategory) { alert('Elegí una categoría para esta frase.'); return; }
  if (phraseModalCategory === 'anime' && !phraseModalSeries) { alert('Elegí una serie de anime para esta frase.'); return; }

  const category = phraseModalCategory;
  const series = phraseModalCategory === 'anime' ? phraseModalSeries : null;
  const phrases = loadPhrases();
  if (editingPhraseId) {
    const p = phrases.find(x => x.id === editingPhraseId);
    p.text = text; p.category = category; p.series = series;
  } else {
    phrases.push({ id: uid(), text, category, series, builtin: false });
  }
  savePhrases(phrases);
  closePhraseModal();
  renderPhrases();
}

function deletePhrase(id) {
  if (!confirm('¿Borrar esta frase?')) return;
  savePhrases(loadPhrases().filter(p => p.id !== id));
  const queues = loadQueues();
  Object.keys(queues).forEach(k => { queues[k] = queues[k].filter(qid => qid !== id); });
  saveQueues(queues);
  renderPhrases();
}

/* ---------- Motor de alarma (chequeo por minuto) ---------- */
let currentRingingAlarm = null;
let lastCheckedMinute = null;

function checkAlarms() {
  if (currentRingingAlarm) return; // ya sonando
  const now = new Date();
  const minuteKey = now.getFullYear() + '-' + now.getMonth() + '-' + now.getDate() + '-' + now.getHours() + '-' + now.getMinutes();
  if (minuteKey === lastCheckedMinute) return;
  lastCheckedMinute = minuteKey;

  const hh = String(now.getHours()).padStart(2, '0');
  const mm = String(now.getMinutes()).padStart(2, '0');
  const currentTime = `${hh}:${mm}`;
  const currentDay = now.getDay();
  const todayKey = now.toDateString();

  const alarms = loadAlarms();
  for (const a of alarms) {
    if (!a.enabled) continue;
    if (a.time !== currentTime) continue;
    if (a.lastFired === todayKey) continue;
    const days = a.days || [];
    if (days.length > 0 && !days.includes(currentDay)) continue;

    a.lastFired = todayKey;
    saveAlarms(alarms);
    fireAlarm(a);
    break;
  }
}
setInterval(checkAlarms, 1000);

let currentYoutubeId = null;

function playYouTubeEmbed(videoId) {
  const frame = document.getElementById('ringVideoFrame');
  frame.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&playsinline=1&rel=0`;
}

document.getElementById('ringVideoPlayBtn').addEventListener('click', () => {
  if (currentYoutubeId) playYouTubeEmbed(currentYoutubeId);
});

function fireAlarm(alarm) {
  currentRingingAlarm = alarm;
  const phrase = getNextPhrase(alarm.themeCategory, alarm.themeSeries);
  document.getElementById('ringTime').textContent = alarm.time;
  document.getElementById('ringPhrase').textContent = phrase.text;

  const tiktokBtn = document.getElementById('ringTiktokBtn');
  if (alarm.tiktok) {
    tiktokBtn.style.display = 'flex';
    tiktokBtn.onclick = () => window.open(alarm.tiktok, '_blank');
  } else {
    tiktokBtn.style.display = 'none';
  }

  const videoWrap = document.getElementById('ringVideoWrap');
  const pulseIcon = document.getElementById('ringPulseIcon');
  const audioEl = document.getElementById('alarmAudio');
  stopAlarmSound();
  audioEl.pause();
  videoWrap.style.display = 'none';
  document.getElementById('ringVideoFrame').src = '';
  currentYoutubeId = null;

  if (alarm.soundType === 'youtube' && alarm.youtubeId) {
    pulseIcon.style.display = 'none';
    videoWrap.style.display = 'block';
    currentYoutubeId = alarm.youtubeId;
    playYouTubeEmbed(alarm.youtubeId);
  } else if (alarm.soundType === 'file' && alarm.audioData) {
    pulseIcon.style.display = '';
    audioEl.src = alarm.audioData;
    audioEl.loop = true;
    audioEl.play().catch(() => {});
  } else {
    pulseIcon.style.display = '';
    playAlarmSound();
  }

  document.getElementById('ringOverlay').classList.add('active');

  if (navigator.vibrate) {
    try { navigator.vibrate([500, 200, 500, 200, 500]); } catch(e){}
  }
}

function stopAlarm() {
  document.getElementById('ringOverlay').classList.remove('active');
  stopAlarmSound();
  const audioEl = document.getElementById('alarmAudio');
  audioEl.pause();
  audioEl.src = '';
  document.getElementById('ringVideoFrame').src = '';
  document.getElementById('ringVideoWrap').style.display = 'none';
  currentRingingAlarm = null;
  currentYoutubeId = null;
  renderAlarms();
}

/* ---------- Sonido (generado con WebAudio, sin archivos externos) ---------- */
let audioCtx = null;
let beepInterval = null;

function playAlarmSound() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    playBeepSequence();
    beepInterval = setInterval(playBeepSequence, 1200);
  } catch(e) { console.warn('No se pudo reproducir sonido', e); }
}

function playBeepSequence() {
  if (!audioCtx) return;
  const now = audioCtx.currentTime;
  [0, 0.22, 0.44].forEach((offset, i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.value = i % 2 === 0 ? 880 : 1046.5;
    gain.gain.setValueAtTime(0, now + offset);
    gain.gain.linearRampToValueAtTime(0.25, now + offset + 0.02);
    gain.gain.linearRampToValueAtTime(0, now + offset + 0.18);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(now + offset);
    osc.stop(now + offset + 0.2);
  });
}

function stopAlarmSound() {
  if (beepInterval) { clearInterval(beepInterval); beepInterval = null; }
}

/* ---------- Inicio ---------- */
renderAlarms();
renderPhraseCategoryFilter();
renderPhrases();

/* Desbloquear audio en móviles con la primera interacción */
document.addEventListener('click', function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch(e){}
}, { once: true });
